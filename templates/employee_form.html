{% extends "base.html" %}
{% block title %}
  {% if employee %}社員編集{% else %}社員登録{% endif %} - AI人事・研修システム
{% endblock %}

{% block content %}
<div class="content-header"><div><h1>{% if employee %}社員情報編集{% else %}社員登録{% endif %}</h1><p>社員の基本情報を入力してください。</p></div></div>
<form method="POST" class="form-card employee-form-card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <h2 class="form-title">👤 {% if employee %}社員情報編集{% else %}社員登録{% endif %}</h2>
  <div class="form-row">
  <div class="form-group">
    <label for="employee_no">社員番号 <span class="required">*</span></label>
    <input type="text" id="employee_no" name="employee_no"
           value="{{ employee.employee_no if employee else '' }}"
           placeholder="例: EMP001" required>
    <p class="help-text">社員を一意に識別する番号です。</p>
  </div>

  <div class="form-group">
    <label for="name">氏名 <span class="required">*</span></label>
    <input type="text" id="name" name="name"
           value="{{ employee.name if employee else '' }}"
           placeholder="例: 山田 太郎" required>
  </div>
  </div>

  <div class="form-row">
  <div class="form-group">
    <label for="department">部署</label>
    <input type="text" id="department" name="department"
           value="{{ employee.department if employee else '' }}"
           placeholder="例: 人事部">
  </div>

  <div class="form-group">
    <label for="position">役職</label>
    <input type="text" id="position" name="position"
           value="{{ employee.position if employee else '' }}"
           placeholder="例: 主任">
  </div>
  </div>

  <div class="form-group">
    <label for="hire_date">入社日</label>
    <input type="date" id="hire_date" name="hire_date"
           value="{{ employee.hire_date if employee else '' }}">
  </div>

  <div class="form-actions form-actions-right">
    <button type="submit" class="btn btn-primary">
      {% if employee %}更新する{% else %}登録する{% endif %}
    </button>
    <a href="{{ url_for('employee_list') }}" class="btn btn-secondary">キャンセル</a>
  </div>

</form>
{% endblock %}
